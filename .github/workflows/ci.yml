name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      # Generated pages must stay in sync with content.js
      - run: npm run build:seo
      - run: git diff --exit-code -- day track robots.txt
      - run: npx playwright install --with-deps chromium
      - run: npm test
