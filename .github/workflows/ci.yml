name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run validate
      - run: npm run verify:scripture
      - run: npm run verify:ui
      - run: npm run verify:audio
      - run: npm run test:unit
      # Generated pages must stay in sync with content.js. sitemap.xml is in
      # the guard because the generator now always writes it — previously it
      # only appeared when SITE_URL was set, which it never was in CI.
      - run: npm run build:seo
      - run: git diff --exit-code -- day track fears es robots.txt sitemap.xml
      - run: npx playwright install --with-deps chromium
      - run: npm test
