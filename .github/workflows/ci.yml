name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Build audio workflow opens its manifest PR with the workflow token,
  # and a PR opened that way starts no workflows on its own; it dispatches
  # this one on the branch instead, and the run shows on the PR's commit.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run validate
      # The traditional prayers must match REMAM's at the locked commit, apart
      # from recorded overrides (scripts/remam-lock.json). No network needed.
      - run: npm run verify:remam
      - run: npm run verify:scripture
      - run: npm run verify:ui
      - run: npm run verify:audio
      - run: npm run test:unit
      # Generated pages must stay in sync with content.js. sitemap.xml is in
      # the guard because the generator now always writes it — previously it
      # only appeared when SITE_URL was set, which it never was in CI. The
      # privacy policy, the terms and 404.html come from the same generator.
      - run: npm run build:seo
      - run: git diff --exit-code -- day track fears es privacy terms 404.html robots.txt sitemap.xml
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # axe-core against every page shape and app dialog, light and dark:
      # the contrast and labelling problems no hand-written check anticipates.
      - run: npm run test:a11y
