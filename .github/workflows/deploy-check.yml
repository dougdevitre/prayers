# Proves a production deployment is actually live. Vercel reports the
# deployment, GitHub records it, and nothing checks that the site now serves
# the merged commit — the alias can lag the build by minutes. This fetches the
# app shell, every script it loads and one page of each static shape from the
# production site and compares them byte for byte with the deployed commit,
# polling for up to three minutes while the alias catches up.
name: Deploy check

on:
  deployment_status:

jobs:
  verify:
    # Vercel names the environment "Production" while one Vercel project is
    # connected to the repository, and "Production – <project>" once a second
    # one is. The audio host (the prayers-audio project) joined on 26 Sep 2026,
    # and from then every run matched nothing and was skipped, silently. So:
    # any production environment except the audio host's, whose deployments
    # are recordings, not this site.
    if: >-
      github.event.deployment_status.state == 'success'
      && startsWith(github.event.deployment.environment, 'Production')
      && !contains(github.event.deployment.environment, 'prayers-audio')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Production serves the deployed commit
        run: node scripts/verify-deploy.js https://prayers.dougdevitre.org --attempts 9 --delay 20000
      # Every day's share card, both sizes: proves the card function works in
      # production (previews sit behind a login) and warms the CDN, so a
      # social site asking for a link preview never waits on a cold render.
      - name: Every share card renders
        run: node scripts/verify-cards.js https://prayers.dougdevitre.org
